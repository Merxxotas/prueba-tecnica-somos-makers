name: Full Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: full-suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-binary-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            cypress-binary-${{ runner.os }}-

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Verify Cypress binary
        run: pnpm cypress:verify

      - name: Run Cypress tests
        run: pnpm test:cypress

      - name: Upload Cypress reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-cypress-reports
          path: |
            automatizacion-web-cypress/cucumber-report/
            automatizacion-web-cypress/cypress/screenshots/
            automatizacion-web-cypress/cypress/videos/
          retention-days: 14

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers & OS dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright regression tests
        run: pnpm test:playwright:regression

      - name: Run Playwright Cucumber suite
        run: pnpm test:playwright

      - name: Run Playwright native BDD suite
        run: pnpm exec bddgen && pnpm exec playwright test

      - name: Upload Playwright reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-playwright-reports
          path: |
            automatizacion-web-playwright/cucumber-report/
            automatizacion-web-playwright/playwright-report/
            automatizacion-web-playwright/test-results/
            evidencias/playwright/
          retention-days: 14

  api-tests:
    name: API ReqRes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache inso-cli binary
        id: cache-inso
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/inso-cli
          key: inso-cli-13.3.1-linux-x64

      - name: Install inso-cli
        if: steps.cache-inso.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/Kong/insomnia/releases/download/core%4013.3.1/inso-linux-x64-13.3.1.tar.xz -o /tmp/inso.tar.xz
          mkdir -p /tmp/inso-extract
          tar -xJf /tmp/inso.tar.xz -C /tmp/inso-extract
          sudo mv /tmp/inso-extract/inso /usr/local/bin/inso-cli
          sudo chmod +x /usr/local/bin/inso-cli
          sudo ln -sf /usr/local/bin/inso-cli /usr/local/bin/inso
          rm -rf /tmp/inso.tar.xz /tmp/inso-extract

      - name: Verify inso-cli
        run: inso-cli --version

      - name: Run Insomnia collection with inso-cli
        run: inso-cli run collection wrk_main -w pruebas-api/insomnia/reqres-api-collection.json -e env_base

      - name: Run automated API assertions
        run: pnpm test:api

      - name: Upload API test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-api-reports
          path: evidencias/insomnia/
          retention-days: 14

  suite-summary:
    name: Full Suite Summary
    runs-on: ubuntu-latest
    needs: [cypress, playwright, api-tests]
    if: always()

    steps:
      - name: Generate summary report
        run: |
          echo "## 📊 Full Test Suite Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Módulo | Estado | Herramienta | Cobertura |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Cypress E2E | ${{ needs.cypress.result == 'success' && '✅ Pasó' || '❌ Falló' }} | Cypress + Cucumber | 18 escenarios de Login |" >> $GITHUB_STEP_SUMMARY
          echo "| Playwright E2E | ${{ needs.playwright.result == 'success' && '✅ Pasó' || '❌ Falló' }} | Playwright + BDD + Cucumber | 18 escenarios + 2 regresión |" >> $GITHUB_STEP_SUMMARY
          echo "| API Testing | ${{ needs.api-tests.result == 'success' && '✅ Pasó' || '❌ Falló' }} | inso-cli + Node.js Runner | 14 requests (100% assertions) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.cypress.result }}" != "success" ] || [ "${{ needs.playwright.result }}" != "success" ] || [ "${{ needs.api-tests.result }}" != "success" ]; then
            echo "::error::One or more test suites failed in the full suite run."
            exit 1
          fi

  deploy-pages:
    name: Deploy Reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [cypress, playwright, api-tests, suite-summary]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Download Cypress reports
        uses: actions/download-artifact@v4
        with:
          name: full-suite-cypress-reports
          path: /tmp/cypress-reports

      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          name: full-suite-playwright-reports
          path: /tmp/playwright-reports

      - name: Download API reports
        uses: actions/download-artifact@v4
        with:
          name: full-suite-api-reports
          path: /tmp/api-reports

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p public/cypress public/playwright public/playwright-report public/api
          
          if [ -d "/tmp/cypress-reports/cucumber-report" ]; then
            cp -r /tmp/cypress-reports/cucumber-report/* public/cypress/ || true
          fi
          
          if [ -d "/tmp/playwright-reports/cucumber-report" ]; then
            cp -r /tmp/playwright-reports/cucumber-report/* public/playwright/ || true
          fi
          if [ -d "/tmp/playwright-reports/playwright-report" ]; then
            cp -r /tmp/playwright-reports/playwright-report/* public/playwright-report/ || true
          fi
          
          if [ -f "/tmp/api-reports/test-report.json" ]; then
            cp /tmp/api-reports/test-report.json public/api/ || true
          elif [ -f "evidencias/insomnia/test-report.json" ]; then
            cp evidencias/insomnia/test-report.json public/api/ || true
          fi

          node scripts/generate-landing.js public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

