name: Deploy Reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-landing.js'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p public/cypress public/playwright public/playwright-report public/api
          
          # Cypress reports
          if [ -d "evidencias/cypress/cucumber-report" ]; then
            cp -r evidencias/cypress/cucumber-report/* public/cypress/
          fi
          if [ -f "public/cypress/cucumber-report.html" ]; then
            cp public/cypress/cucumber-report.html public/cypress/index.html
          fi

          # Playwright Cucumber reports
          if [ -d "evidencias/playwright/cucumber-report" ]; then
            cp -r evidencias/playwright/cucumber-report/* public/playwright/
          elif [ -d "automatizacion-web-playwright/cucumber-report" ]; then
            cp -r automatizacion-web-playwright/cucumber-report/* public/playwright/
          fi
          if [ -f "public/playwright/cucumber-report.html" ]; then
            cp public/playwright/cucumber-report.html public/playwright/index.html
          fi

          # Playwright Native HTML report
          if [ -d "automatizacion-web-playwright/playwright-report" ]; then
            cp -r automatizacion-web-playwright/playwright-report/* public/playwright-report/
          fi

          # API report
          if [ -d "evidencias/insomnia" ]; then
            cp -r evidencias/insomnia/* public/api/
          fi

          # Generar index.html
          node scripts/generate-landing.js public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
